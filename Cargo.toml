[package]
name = "xyz-tui"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "小宇宙终端客户端"

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
html2text = "0.6"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
qrcode = { version = "0.14", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "process", "net", "io-util"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
unicode-segmentation = "1.13"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6"
rqrr = { version = "0.10", default-features = false }

[profile.release]
lto = "thin"
strip = true
